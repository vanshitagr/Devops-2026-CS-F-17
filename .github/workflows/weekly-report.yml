name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Every Saturday at 11:59 PM IST
    - cron: '29 18 * * 6'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Report Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab matplotlib

      - name: Generate Project Evaluation Report
        run: |
          python generate_report.py

      - name: Archive Generated Report
        run: |
          mkdir -p weekly_reports
          mv Devops-2026-CS-F-16_Final_Project_Evaluation_Report.pdf \
             weekly_reports/Devops-2026-CS-F-16_Final_Project_Evaluation_Report.pdf

      - name: Commit Report
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add weekly_reports/

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "docs: update project evaluation report [skip ci]"
            git push origin HEAD:main
          fi